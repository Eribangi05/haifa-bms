name: rwanda-mobility-ci
on:
  push:
    paths: ['rwanda-mobility/**', '.github/workflows/rwanda-mobility-ci.yml']
  pull_request:
    paths: ['rwanda-mobility/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rm, POSTGRES_PASSWORD: rm, POSTGRES_DB: rwanda_mobility_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: rwanda-mobility/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rwanda-mobility/backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rwanda-mobility/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rwanda-mobility/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/net.test.ts
      - run: npx expo export --platform android --output-dir /tmp/export
