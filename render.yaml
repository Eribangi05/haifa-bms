# Render Blueprint for the Abasare API (staging). Dashboard: New > Blueprint > select this repo.
# Creates a managed PostgreSQL and a Docker web service. Migrations and seeding run on start.
databases:
  - name: abasare-db
    plan: free            # free Postgres expires after 30 days on Render: use a paid plan for anything lasting
    databaseName: rwanda_mobility
    user: rm
services:
  - type: web
    name: abasare-api
    runtime: docker
    plan: free            # free web services sleep after inactivity: first request is slow
    dockerContext: rwanda-mobility
    dockerfilePath: rwanda-mobility/backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: abasare-db, property: connectionString } }
      - { key: NODE_ENV, value: production }
      - { key: APP_ENV, value: staging }
      - { key: OTP_DEV_ECHO, value: "true" }     # STAGING ONLY: shows the OTP in the app because no SMS gateway is connected yet
      - { key: MOMO_MODE, value: simulator }     # payments are simulated until MTN credentials exist
      - { key: SMS_PROVIDER, value: console }
      - { key: PUSH_PROVIDER, value: none }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DATA_ENC_KEY, generateValue: true }
      - { key: PIN_SECRET, generateValue: true }
      - { key: FILE_SIGNING_SECRET, generateValue: true }
      - { key: BOOTSTRAP_ADMIN_EMAIL, value: admin@abasare.example }   # change to your email
      - { key: BOOTSTRAP_ADMIN_PASSWORD, sync: false }                  # you type it in the dashboard (>= 12 chars)
      - { key: PUBLIC_BASE_URL, sync: false }                           # e.g. https://abasare-api.onrender.com
