<style>

<script type="text/plain" id="solverSrc">const ST_MORNING_SUBJECTS = ['maths','english','kinyarwanda'];
const ST_LATE_SUBJECTS = ['arts','pes'];
const ST_RESTARTS = 40;         // seeded greedy attempts (cut short by the time budget), keep the best
const ST_POLISH_ITERS = 6000;   // bounded local-search moves after the best placement
const ST_TIME_BUDGET_MS = 900;  // whole solve stays under about a second so the screen stays responsive
function stPeriodSlots(cfg){
  const out=[]; (cfg.days||[]).forEach(day=>{ for(let p=1;p<=cfg.periodsPerDay;p++) out.push({day,period:p,key:day+'_'+p}); }); return out;
}
function stRng(seed){
  let a=(seed>>>0)||1;
  return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function stShuffle(arr, seed){
  const out=arr.slice(); const rng=stRng(seed||1);
  for(let i=out.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}

/* ---------- placement state ---------- */
function stNewState(){ return { grid:{}, busy:{}, at:{}, tDay:{}, sDay:{}, sSubj:{}, rm:{}, roomOpts:{}, roomCap:{}, roomUse:{} }; }
function stEnsure(st, sectionId, teacherId){
  if(!st.grid[sectionId]) st.grid[sectionId]={}; if(!st.sDay[sectionId]) st.sDay[sectionId]={};
  if(teacherId){ if(!st.busy[teacherId]) st.busy[teacherId]=new Set(); if(!st.at[teacherId]) st.at[teacherId]={}; if(!st.tDay[teacherId]) st.tDay[teacherId]={}; }
}
function stPut(st, sectionId, slot, cell){
  stEnsure(st, sectionId, cell.teacherId);
  st.grid[sectionId][slot.key]=cell;
  if(cell.teacherId){ st.busy[cell.teacherId].add(slot.key); st.at[cell.teacherId][slot.key]=sectionId; st.tDay[cell.teacherId][slot.day]=(st.tDay[cell.teacherId][slot.day]||0)+1; }
  if(cell.roomId){ const r=st.rm[cell.roomId]||(st.rm[cell.roomId]={}); r[slot.key]=(r[slot.key]||0)+1; st.roomUse[cell.roomId]=(st.roomUse[cell.roomId]||0)+1; }
  (st.sDay[sectionId][slot.day]=st.sDay[sectionId][slot.day]||new Set()).add(slot.period);
  const sk=sectionId+'|'+cell.subjectKey; const m=(st.sSubj[sk]=st.sSubj[sk]||{}); m[slot.day]=(m[slot.day]||0)+1;
}
function stTake(st, sectionId, slot){
  const cell=st.grid[sectionId][slot.key]; delete st.grid[sectionId][slot.key];
  if(cell.teacherId){ st.busy[cell.teacherId].delete(slot.key); delete st.at[cell.teacherId][slot.key]; st.tDay[cell.teacherId][slot.day]--; }
  if(cell.roomId){ st.rm[cell.roomId][slot.key]--; st.roomUse[cell.roomId]--; }
  st.sDay[sectionId][slot.day].delete(slot.period);
  st.sSubj[sectionId+'|'+cell.subjectKey][slot.day]--;
  return cell;
}
/* ---- rooms and labs: a room can hold `capacity` classes at once (a lab 1, a playground several) ---- */
function stRoomFree(st, roomId, key){ return (((st.rm[roomId]||{})[key])||0) < (st.roomCap[roomId]||1); }
// '' = this lesson needs no special room; null = every allowed room is already full at those periods;
// otherwise the least-used allowed room that is free for ALL the given period keys (1 for a single, 2 for a double)
function stRoomPick(st, sectionId, subjectKey, keys){
  const opts=st.roomOpts[sectionId+'|'+subjectKey]; if(!opts||!opts.length) return '';
  let best=null, bu=Infinity;
  for(const r of opts){ if(keys.every(k=>stRoomFree(st,r,k))){ const u=st.roomUse[r]||0; if(u<bu){ bu=u; best=r; } } }
  return best;
}
// hard constraints for putting `teacherId` into slot: free, not on a day off, under the daily maximum
function stTeacherCan(st, rules, teacherId, slot){
  if(!teacherId) return true;
  if(st.busy[teacherId] && st.busy[teacherId].has(slot.key)) return false;
  const off=rules&&rules.offDays&&rules.offDays[teacherId]; if(off&&off.has(slot.day)) return false;
  const offS=rules&&rules.offSlots&&rules.offSlots[teacherId]; if(offS&&offS.has(slot.key)) return false;
  const cap=rules&&rules.maxPerDay&&rules.maxPerDay[teacherId]; if(cap && ((st.tDay[teacherId]||{})[slot.day]||0)>=cap) return false;
  return true;
}
function stSlotSoftScore(subjectId, day, period, cfg, teacherBusy, teacherId, sectionSubjDay, sectionId, extra){
  // kept for compatibility with earlier callers/tests; the solver uses stScoreSlot below
  let score=0;
  const dayKey=sectionId+'|'+subjectId;

/* Bounded local search: move a lesson into a free slot of the same section, or swap two lessons of a section, and keep the

  const evict=(sec,key,out)=>{ const cell=st.grid[sec]&&st.grid[sec][key]; if(!cell) return; const s=byKey[key];
    stTake(st,sec,s); out.push({sec,key,cell});
    if(cell.double){ const [d,p]=[key.slice(0,key.lastIndexOf('_')),+key.slice(key.lastIndexOf('_')+1)], mk=d+'_'+(cell.blockPos===0?p+1:p-1), m=st.grid[sec][mk];
      if(m&&m.blockId===cell.blockId&&!m.locked){ stTake(st,sec,byKey[mk]); out.push({sec,key:mk,cell:m}); } } };

    for(let i=0;i<slots.length;i++){ const s=slots[i]; if(grid[s.key]||!stTeacherCan(st,rules,l.teacherId,s)) continue;
      const room=stRoomPick(st,l.sectionId,l.subjectId,[s.key]); if(room===null) continue;
      const sc=stScoreSlot(task,s,st,cfg,rules)+rng()*0.5; if(sc>bs){ bs=sc; best=s; br=room; } }
    if(!best) return false;
    stPut(st,l.sectionId,best,Object.assign({subjectKey:l.subjectId,teacherId:l.teacherId,blockId:best.key},br?{roomId:br}:{})); return true; };

/* Full solve: several seeded greedy attempts (most-constrained lessons first), keep the best, then polish it - all within
   a time budget so the screen stays responsive. */
function stSolve(tasks, slots, cfg, opts){

  const rules=opts.rules||{};

  const flex=t=>{ const off=rules.offDays&&rules.offDays[t.teacherId]; const days=(cfg.days||[]).length-(off?off.size:0); return days*cfg.periodsPerDay; };
  const ordered=tasks.slice().sort((a,b)=> ((load[b.teacherId]/flex(b))-(load[a.teacherId]/flex(a))) || (b.periodsNeeded-a.periodsNeeded));
  const tk=t=>t.sectionId+'|'+t.subjectId, bump={};
  let best=null, attempts=0, lastReport=0;
  const unplacedOf=r=>r.failures.reduce((a,f)=>a+f.missing,0);
  const report=force=>{ if(!opts.progress) return; const now=Date.now(); if(!force&&now-lastReport<400) return; lastReport=now; opts.progress({attempt:attempts,unplaced:best?unplacedOf(best):null,elapsed:now-t0,grid:best?best.sectionGrid:null}); };
  for(let attempt=0; ; attempt++){
    const elapsed=Date.now()-t0;
    if(best){
      if(unplacedOf(best)===0){ if(attempt>=ST_RESTARTS||elapsed>budget*0.55) break; }          // everything placed: a few more tries for a tidier timetable
      else if(elapsed>budget*0.9) break;                                                          // still unplaced lessons: keep trying until the time budget is nearly used
    }

    const order=attempt===0?ordered:(()=>{ const jit=stRng(seed*31+attempt*7919+13), rank=new Map(), spread=Math.min(ordered.length*0.5,6+attempt); ordered.forEach((t,i)=>rank.set(t,i+(jit()-0.5)*spread));
      return ordered.slice().sort((a,b)=>((bump[tk(b)]||0)-(bump[tk(a)]||0))||(rank.get(a)-rank.get(b))); })();

/* ---------- feasibility pre-check: say in plain words what cannot work BEFORE generating ---------- */
function stPrecheck(tasks, cfg, rules, opts){
  opts=opts||{}; const issues=[]; const slotsPerWeek=(cfg.days||[]).length*cfg.periodsPerDay; rules=rules||{};
  const secTotals={}; tasks.forEach(t=>{ secTotals[t.sectionId]=(secTotals[t.sectionId]||0)+t.periodsNeeded; });
  Object.keys(secTotals).forEach(sid=>{
    if(secTotals[sid]>slotsPerWeek) issues.push({level:'error',msg:`${(opts.sectionLabel||(x=>x))(sid)} needs ${secTotals[sid]} periods a week but the week only has ${slotsPerWeek}. Reduce the weekly periods.`});
  });
  const load={}; tasks.forEach(t=>{ load[t.teacherId]=(load[t.teacherId]||0)+t.periodsNeeded; });
  Object.keys(load).forEach(tid=>{
    const off=rules.offDays&&rules.offDays[tid]; const days=(cfg.days||[]).length-(off?off.size:0);
    const cap=rules.maxPerDay&&rules.maxPerDay[tid]; const perDay=cap?Math.min(cap,cfg.periodsPerDay):cfg.periodsPerDay;
    const offS=rules.offSlots&&rules.offSlots[tid]; let avail=0; (cfg.days||[]).forEach(d=>{ if(off&&off.has(d)) return; let n=cfg.periodsPerDay; if(offS) n-=[...offS].filter(k=>k.slice(0,k.lastIndexOf('_'))===d).length; avail+=Math.max(0,cap?Math.min(cap,n):n); }); const name=(opts.teacherName||(x=>x))(tid);

// human-readable quality summary of a solved timetable
function stQualityOf(result, cfg){

  Object.keys(result.sectionGrid).forEach(sid=>{
    const grid=result.sectionGrid[sid]; const perDay={}; const subj={};
    Object.keys(grid).forEach(key=>{ const i=key.lastIndexOf('_'); const d=key.slice(0,i), p=+key.slice(i+1); (perDay[d]=perDay[d]||[]).push(p); const m=(subj[grid[key].subjectKey]=subj[grid[key].subjectKey]||{n:0,d:{},double:false}); m.n++; m.d[d]=(m.d[d]||0)+1; if(grid[key].double) m.double=true; });
    Object.keys(perDay).forEach(d=>{ holes+=Math.max.apply(null,perDay[d])-perDay[d].length; });
    Object.keys(subj).forEach(k=>{ const allowed=subj[k].double?2:Math.max(1,Math.ceil(subj[k].n/days)); Object.keys(subj[k].d).forEach(d=>{ if(subj[k].d[d]>allowed) repeats+=subj[k].d[d]-allowed; }); });

function migrate(d){   /* open backups / saved data made by earlier versions */
  const v=d.version||0;
  if(!Array.isArray(d.levels)) d.levels=LEVELS.map(l=>({id:l.id,on:l.id==='primary',periods:l.periods}));
  if(v<5){   /* split the old single "primary" level into lower primary (P1-P3) and upper primary (P4-P6); never touches lessons already set */
    const old=d.levels.find(l=>l.id==='primary');
    if(!d.levels.some(l=>l.id==='plow')) d.levels.push({id:'plow',on:old?old.on:false,periods:old?old.periods:5});
    d.classes.forEach(c=>{ if((c.level||'primary')==='primary'&&/^(primary|p)\s*[123](\D|$)/i.test(c.name)) c.level='plow'; });
    SUBJECT_LIB.forEach(s=>{ if(!d.subjects.some(x=>x.id===s.id)) d.subjects.push(Object.assign({},s)); });
  }
  LEVELS.forEach(l=>{ if(!d.levels.some(x=>x.id===l.id)) d.levels.push({id:l.id,on:false,periods:l.periods}); });
  d.classes.forEach(c=>{ if(!c.level) c.level='primary'; if(c.combo==null) c.combo=''; });
  const order=LEVELS.map(l=>l.id); d.classes.sort((a,b)=>order.indexOf(a.level)-order.indexOf(b.level));
  if(!Array.isArray(d.rooms)) d.rooms=[]; if(!d.subjectRooms) d.subjectRooms={}; if(!d.roomPlan) d.roomPlan={};
  if(!Array.isArray(d.versions)) d.versions=[]; if(d.logo==null) d.logo=''; if(d.term==null) d.term=''; if(d.head==null) d.head='';
  d.teachers.forEach(t=>{ if(!Array.isArray(t.offSlots)) t.offSlots=[]; });
  d.version=5; return d;
}

/* ---------- day layout ---------- */
function toMins(hhmm){ const [h,m]=(hhmm||'08:00').split(':').map(Number); return h*60+(m||0); }
function fmt(m){ return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function schedule(cfg){
  const out=[]; let t=toMins(cfg.dayStart);
  if(cfg.assemblyMins>0){ out.push({type:'assembly',label:'Assembly',start:t,end:t+cfg.assemblyMins}); t+=cfg.assemblyMins; }
  for(let p=1;p<=cfg.periodsPerDay;p++){
    out.push({type:'period',period:p,start:t,end:t+cfg.periodMins}); t+=cfg.periodMins;
    if(p===cfg.lunchAfterPeriod){ out.push({type:'lunch',label:'Lunch',start:t,end:t+cfg.lunchMins}); t+=cfg.lunchMins; }
    else if((cfg.breaksAfter||[]).includes(p)){ out.push({type:'break',label:'Break',start:t,end:t+cfg.shortBreakMins}); t+=cfg.shortBreakMins; }
  }
  return out;
}
function prune(){   /* drop lessons that no longer fit the school (day structure, classes, subjects, teachers, rooms) - also used after Undo, Versions and Open backup */
  const days=new Set(S.cfg.days);
  Object.keys(S.timetable).forEach(cid=>{
    if(!cls(cid)){ delete S.timetable[cid]; return; }
    const L=levelPeriods(cid), g=S.timetable[cid];
    Object.keys(g).forEach(k=>{ const x=g[k], [d,p]=stSplitKey(k);
      if(!days.has(d)||p>L||!S.subjects.some(s=>s.id===x.subjectKey)||(x.teacherId&&!teacher(x.teacherId))) delete g[k];
      else if(x.roomId&&!room(x.roomId)) delete x.roomId; });
    Object.keys(g).forEach(k=>{ const x=g[k]; if(x.double){ const [d,p]=stSplitKey(k), mate=g[d+'_'+(x.blockPos===0?p+1:p-1)]; if(!mate||mate.blockId!==x.blockId){ delete x.double; delete x.blockPos; } } });
  });
}
function stSplitKey(key){ const i=key.lastIndexOf('_'); return [key.slice(0,i),+key.slice(i+1)]; }

/* ---------- comparison with REB's weekly periods ---------- */
function refFor(level,sid){ const r=REF[level]; return r&&r[sid]?r[sid]:null; }
function rebCheck(cid){
  const c=cls(cid), ref=REF[c.level]; if(!ref) return null; const plan=planOf(cid), rows=[];
  Object.keys(plan).forEach(sid=>{ const r=ref[sid], have=plan[sid]||0; if(!r) rows.push({sid,kind:'extra',have}); else if(have!==r[0]) rows.push({sid,kind:'differs',have,ref:r[0],v:r[1]}); });
  if(c.level!=='upper') Object.keys(ref).forEach(sid=>{ if(!(sid in plan)) rows.push({sid,kind:'missing',have:0,ref:ref[sid][0],v:ref[sid][1]}); });
  return rows;
}
function rebPanel(cid){
  const c=cls(cid), L=lvl(c.level), rows=rebCheck(cid); if(!rows) return ''; const src=SRC[L.src];
  const badge=src.ok?'<span style="color:var(--ok)">Official REB figures</span>':'<span style="color:var(--warn)">Not official: confirm with REB</span>';
  const nm=sid=>esc(subj(sid).name), unv=r=>r.v===0?' <span title="Not stated in the REB files I could read">&#9888;</span>':'';
  const lines=rows.map(r=>r.kind==='differs'?`<li>${nm(r.sid)}: you have <b>${r.have}</b>, REB has <b>${r.ref}</b>${unv(r)}</li>`:r.kind==='missing'?`<li>${nm(r.sid)}: REB lists <b>${r.ref}</b>${unv(r)}, this class has none</li>`:`<li>${nm(r.sid)}: <b>${r.have}</b> periods, which is not in REB's table for this level</li>`).join('');
  return `<div class="msg ${rows.length?'warn':'ok'}" style="margin-top:10px"><b>Compared with REB (${esc(L.name)}):</b> ${rows.length?'differs in '+rows.length+' place(s)':'matches the weekly periods'}. ${badge}.
    ${rows.length?`<ul style="margin:6px 0 0 18px">${lines}</ul><div style="margin-top:6px"><button class="btn sm" onclick="applyREB('${cid}')">Set this class to the REB figures</button></div>`:''}
    <div style="margin-top:4px;font-size:12px;opacity:.85">Source: ${esc(src.label)}.</div></div>`;
}
function applyREB(cid){ const c=cls(cid), ref=REF[c.level]; if(!ref) return; if(!confirm("Change this class's periods to the REB figures? Teachers are kept.")) return;
  const plan=planOf(cid); Object.keys(ref).forEach(s=>{ if(c.level==='upper'){ if(s in plan) plan[s]=ref[s][0]; } else plan[s]=ref[s][0]; }); save(); render(); }
function resetLevelToREB(id){ const cs=S.classes.filter(c=>c.level===id); if(!cs.length) return;
  if(!confirm(`Reset the subjects and weekly periods of ${cs.length} ${lvl(id).name} class(es) to the REB starting point? Teachers for subjects that stay are kept; lessons already in the timetable for removed subjects are dropped.`)) return;
  cs.forEach(c=>{ const t=templateFor(id,c.combo); const old=planOf(c.id); const keepAsg=assignOf(c.id), keepDbl=doublesOf(c.id);
    Object.keys(keepAsg).forEach(k=>{ if(!(k in t)) delete keepAsg[k]; }); Object.keys(keepDbl).forEach(k=>{ if(!(k in t)) delete keepDbl[k]; });
    Object.keys(old).forEach(k=>{ if(!(k in t)) dropSubjectFrom(c.id,k); }); S.plan[c.id]=t; }); prune(); save(); render(); toast('Reset to the REB starting point.'); }

function prepareGenerate(discardLocks){

    const need=tasks.filter(x=>x.sectionId===c.id).reduce((a,x)=>a+x.periodsNeeded,0), room=cfg.days.length*L;
    if(need>room) capIssues.push({level:'error',msg:`${c.name} needs ${need} periods a week but only has room for ${room} (${L} a day). Reduce its weekly periods or give its level more periods a day.`}); });
  if(!discardLocks) Object.keys(S.timetable).forEach(cid=>Object.keys(S.timetable[cid]).forEach(k=>{ const c=S.timetable[cid][k]; if(c.locked&&cls(cid)&&teacher(c.teacherId)&&c.subjectKey!=='__off__') (locked[cid]=locked[cid]||{})[k]=c; }));
  const issues=capIssues.concat(stPrecheck(tasks,cfg,rules,{sectionLabel:id=>cls(id).name,teacherName:tName}).filter(i=>!/ periods a week but the week only has /.test(i.msg)));

function editSubjChange(cid){ const m=$('eMsg'), d=m.dataset; fillTeachers(cid,$('eSubj').value,null); fillRooms(cid,$('eSubj').value,null,d.day,+d.period); editCheck(cid,d.day,+d.period); }
function editCheck(cid,day,period){
  const m=$('eMsg'); m.dataset.day=day; m.dataset.period=period; const tid=$('eTeach').value, key=day+'_'+period; let err='';
  if(tid){ const t=teacher(tid);

    else if(t.offDays.includes(day)) err=`${t.name} has ${DAY_LABELS[day]} off.`;

    else if(t.maxPerDay>0){ let n=0; Object.keys(S.timetable).forEach(c=>Object.keys(S.timetable[c]).forEach(k=>{ const [d]=stSplitKey(k); if(d===day&&k!==(c===cid?key:'')&&S.timetable[c][k].teacherId===tid) n++; })); if(n>=t.maxPerDay) err=`${t.name} already has ${n} periods on ${DAY_LABELS[day]} (their limit is ${t.maxPerDay}).`; } }

/* ---- independent verifier: re-checks the finished timetable from scratch, whoever made it (engine, drag, or hand edit) ---- */
function validate(tt){
  tt=tt||S.timetable; const issues=[], tAt={}, rAt={}, perDay={};
  S.classes.forEach(c=>{ const g=tt[c.id]||{}, L=levelPeriods(c.id);
    Object.keys(g).forEach(k=>{ const x=g[k], [d,p]=stSplitKey(k), where=`${c.name}, ${DAY_LABELS[d]||d} P${p}`;
      if(p>L||!S.cfg.days.includes(d)) issues.push({type:'outside',msg:`${where}: a lesson outside this class's school day.`});
      if(x.teacherId){ const t=teacher(x.teacherId); (tAt[x.teacherId+'|'+k]=tAt[x.teacherId+'|'+k]||[]).push(c.name);
        if(t){ if(t.offDays.includes(d)) issues.push({type:'off',msg:`${t.name} is booked on ${DAY_LABELS[d]}, their day off (${where}).`});
          if((t.offSlots||[]).includes(k)) issues.push({type:'off',msg:`${t.name} is booked at a time they are unavailable (${where}).`});
          perDay[t.id+'|'+d]=(perDay[t.id+'|'+d]||0)+1; } }
      if(x.roomId) (rAt[x.roomId+'|'+k]=rAt[x.roomId+'|'+k]||[]).push(c.name); }); });
  Object.keys(tAt).forEach(k=>{ if(tAt[k].length>1){ const [tid,key]=k.split('|'), [d,p]=stSplitKey(key); issues.push({type:'clash',msg:`${tName(tid)} is teaching ${tAt[k].join(' and ')} at the same time (${DAY_LABELS[d]} P${p}).`}); } });
  Object.keys(rAt).forEach(k=>{ const [rid,key]=k.split('|'), [d,p]=stSplitKey(key); if(rAt[k].length>roomCapOf(rid)) issues.push({type:'room',msg:`${rName(rid)} is over-booked by ${rAt[k].join(' and ')} (${DAY_LABELS[d]} P${p}).`}); });
  S.teachers.forEach(t=>{ if(t.maxPerDay>0) S.cfg.days.forEach(d=>{ const n=perDay[t.id+'|'+d]||0; if(n>t.maxPerDay) issues.push({type:'max',msg:`${t.name} has ${n} periods on ${DAY_LABELS[d]} (their limit is ${t.maxPerDay}).`}); }); });
  return issues;
}
function shortfalls(){ const out=[]; S.classes.forEach(c=>S.subjects.forEach(s=>{ if(!(s.id in planOf(c.id))) return; const want=planOf(c.id)[s.id]||0; if(!want) return; const got=Object.values(S.timetable[c.id]||{}).filter(x=>x.subjectKey===s.id).length; if(got!==want) out.push({c,s,want,got}); })); return out; }
function teacherStats(t){ const days={}, sc=teacherSchedule(t.id), cl=new Set(); let total=0,gaps=0;
  Object.keys(sc).forEach(k=>{ const [d,p]=stSplitKey(k); (days[d]=days[d]||[]).push(p); total++; cl.add(sc[k].classId); });
  Object.keys(days).forEach(d=>{ const ps=days[d]; gaps+=Math.max.apply(null,ps)-Math.min.apply(null,ps)+1-ps.length; });
  return {total,gaps,days,classes:cl.size}; }

    ${issues.length?issues.map(i=>`<div class="msg err">${esc(i.msg)}</div>`).join(''):'<div class="msg ok">No problems: no teacher or room is double-booked, and every day off, unavailable time and daily limit is respected.</div>'}

    ${stats.map(({t,s})=>`<tr><td>${esc(t.name)}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="background:${tColor(t.id)};height:8px;border-radius:4px;width:${Math.max(4,Math.round(120*s.total/cap))}px"></div>${s.total}</div></td><td>${s.classes}</td>${S.cfg.days.map(d=>`<td style="text-align:center">${(s.days[d]||[]).length||'&ndash;'}</td>`).join('')}<td>${s.gaps}</td></tr>`).join('')}</tbody></table></div></div>

/* ---- 9. cover for an absent teacher ---- */
function vCover(){

      <button class="btn pri" onclick="findCover()" ${COVER.tid?'':'disabled'}>Find cover</button></div></div>`;
  if(COVER.found&&COVER.tid){ const les=coverLessons();

    if(!les.length) h+='<div class="msg ok" style="margin-top:10px">This teacher has no lessons on the chosen day(s).</div>';
    else h+=`<div class="scroll"><table class="t" style="margin-top:8px"><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Cover teacher</th></tr></thead><tbody>${les.map(l=>{ const pk=l.key+'@'+l.cid, cands=coverCandidates(l), cur=COVER.picks[pk]||'';
      const opts=`<option value="">- nobody yet -</option>`+cands.map(c=>`<option value="${c.t.id}" ${cur===c.t.id?'selected':''}>${esc(c.t.name)}${c.teachesClass?' - teaches this class':c.teachesSubj?' - teaches this subject':''}</option>`).join('');
      const tm=schedule(S.cfg).find(x=>x.type==='period'&&x.period===l.p);
      return `<tr><td>${DAY_LABELS[l.d]}</td><td>P${l.p} &middot; ${fmt(tm.start)}</td><td>${esc(cls(l.cid).name)}</td><td>${esc(subj(l.subjectKey).name)}</td><td>${cands.length||cur?`<select onchange="COVER.picks['${pk}']=this.value;render()">${opts}</select>`:'<span style="color:var(--bad)">Nobody is free at this time</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
    h+='</div>'; }
  return h;
}
function coverDay(d,on){ const s=new Set(COVER.days); on?s.add(d):s.delete(d); COVER.days=S.cfg.days.filter(x=>s.has(x)); COVER.found=false; COVER.picks={}; render(); }
function coverLessons(){ const sc=teacherSchedule(COVER.tid), out=[]; Object.keys(sc).forEach(k=>{ const [d,p]=stSplitKey(k); if(COVER.days.includes(d)) out.push({key:k,d,p,cid:sc[k].classId,subjectKey:sc[k].subjectKey}); }); out.sort((a,b)=>(S.cfg.days.indexOf(a.d)-S.cfg.days.indexOf(b.d))||(a.p-b.p)); return out; }
function coverCandidates(l){
  const out=[];
  S.teachers.forEach(t=>{ if(t.id===COVER.tid) return; const sc=teacherSchedule(t.id);
    if(sc[l.key]) return; if(t.offDays.includes(l.d)||(t.offSlots||[]).includes(l.key)) return;
    let busyCover=false, covers=0, dayCovers=0;
    Object.keys(COVER.picks).forEach(k2=>{ if(COVER.picks[k2]!==t.id) return; const [kk,cid2]=k2.split('@'); covers++; if(kk.split('_')[0]===l.d) dayCovers++; if(kk===l.key&&cid2!==l.cid) busyCover=true; });
    if(busyCover) return;
    const own=COVER.picks[l.key+'@'+l.cid]===t.id; const dayLoad=Object.keys(sc).filter(k=>k.split('_')[0]===l.d).length+dayCovers-(own?1:0);
    if(t.maxPerDay>0&&dayLoad>=t.maxPerDay) return;
    const teachesClass=Object.values(sc).some(x=>x.classId===l.cid), teachesSubj=Object.values(sc).some(x=>x.subjectKey===l.subjectKey);
    out.push({t,teachesClass,teachesSubj,score:(teachesClass?30:0)+(teachesSubj?20:0)-dayLoad*2-(covers-(own?1:0))*3}); });
  out.sort((a,b)=>b.score-a.score); return out;
}
function findCover(){ COVER.picks={}; coverLessons().forEach(l=>{ const c=coverCandidates(l); if(c.length) COVER.picks[l.key+'@'+l.cid]=c[0].t.id; }); COVER.found=true; render(); }
function coverRows(){ const sched=schedule(S.cfg); return coverLessons().map(l=>{ const tm=sched.find(x=>x.type==='period'&&x.period===l.p), pick=COVER.picks[l.key+'@'+l.cid], cell=(S.timetable[l.cid]||{})[l.key]||{};
  return {day:DAY_LABELS[l.d],time:`P${l.p} ${fmt(tm.start)}-${fmt(tm.end)}`,cls:cls(l.cid).name,subj:subj(l.subjectKey).name,cover:pick?tName(pick):'(none found)',room:cell.roomId?rName(cell.roomId):''}; }); }
function printCover(){ const rows=coverRows();
  doPrint(`<div class="sheet">${sheetHead()}<div class="meta"><b>Cover sheet</b> &mdash; absent: ${esc(tName(COVER.tid))} (${COVER.days.map(d=>DAY_LABELS[d]).join(', ')})</div><table><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Cover teacher</th><th>Room</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day}</td><td>${r.time}</td><td>${esc(r.cls)}</td><td>${esc(r.subj)}</td><td><b>${esc(r.cover)}</b></td><td>${esc(r.room)}</td></tr>`).join('')}</tbody></table>${sheetFoot()}</div>`); }
function coverText(){ const rows=coverRows(); copyText(`*Cover - ${tName(COVER.tid)} absent*\n`+rows.map(r=>`${r.day} ${r.time}: ${r.cls} ${r.subj} -> ${r.cover}${r.room?' ('+r.room+')':''}`).join('\n')); }

/* ---- drag & drop a lesson to another period (checked, and undoable) ---- */
function dragStart(ev,cid,key){ DRAG={cid,key}; try{ ev.dataTransfer.setData('text/plain',key); ev.dataTransfer.effectAllowed='move'; }catch(e){} }
function dropOn(ev,cid,key){ ev.preventDefault(); const d=DRAG; DRAG=null; if(!d||d.cid!==cid||d.key===key) return; moveOrSwap(cid,d.key,key); }
function moveOrSwap(cid,from,to){
  const g=S.timetable[cid]||{}, a=g[from], b=g[to]; if(!a) return;
  if(a.double||(b&&b.double)){ toast('Double periods move with the Edit box: click the lesson.'); return; }
  if(stSplitKey(to)[1]>levelPeriods(cid)) return;
  const before=new Set(validate().map(i=>i.msg)), snap=JSON.stringify(S.timetable); pushHistory();
  delete g[from]; if(b){ g[from]=b; b.blockId=from; b.locked=true; } g[to]=a; a.blockId=to; a.locked=true;
  const bad=validate().filter(i=>!before.has(i.msg));
  if(bad.length){ S.timetable=JSON.parse(snap); HIST.pop(); toast(bad[0].msg+' Move cancelled.'); render(); return; }
  save(); render();
}

/* ---- saved versions (for example one per term) ---- */
function lessonsIn(tt){ return Object.values(tt).reduce((a,g)=>a+Object.keys(g).length,0); }
function openVersions(){
  $('modalBox').innerHTML=`<h2 style="margin:0 0 4px">Saved versions</h2><p class="h">Keep a copy of this timetable, for example "Term 2 2026", and open it again later.</p>
    <div class="row"><input id="verName" placeholder="Name, e.g. Term 2 2026" style="flex:1"><button class="btn pri" onclick="saveVersion()">Save this version</button></div><div id="verList">${versionList()}</div>
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="closeModal()">Close</button></div>`; $('modal').classList.add('on');
}
function versionList(){ return S.versions.length?S.versions.map(v=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);margin-top:8px"><div style="flex:1"><b>${esc(v.name)}</b><br><small style="color:var(--mute)">${new Date(v.at).toLocaleString()} &middot; ${lessonsIn(v.timetable)} lessons</small></div><button class="btn sm" onclick="restoreVersion('${v.id}')">Open</button><button class="btn sm bad" onclick="delVersion('${v.id}')">Delete</button></div>`).join(''):'<div class="msg warn" style="margin-top:12px">No saved versions yet.</div>'; }
function saveVersion(){ if(!hasTimetable()){ toast('Build a timetable first.'); return; } const n=($('verName').value||'').trim()||('Version '+(S.versions.length+1)); S.versions.unshift({id:uid('v'),name:n,at:Date.now(),timetable:JSON.parse(JSON.stringify(S.timetable))}); save(); $('verList').innerHTML=versionList(); $('verName').value=''; toast('Saved "'+n+'".'); }
function restoreVersion(id){ const v=S.versions.find(x=>x.id===id); if(!v) return; if(!confirm('Replace the current timetable with "'+v.name+'"? You can undo this.')) return; pushHistory(); S.timetable=JSON.parse(JSON.stringify(v.timetable)); prune(); save(); closeModal(); render(); toast('Opened "'+v.name+'".'); }
function delVersion(id){ S.versions=S.versions.filter(x=>x.id!==id); save(); $('verList').innerHTML=versionList(); }

/* ---- share as text (WhatsApp / SMS) ---- */
function shareText(){
  if(!VIEW.id||!hasTimetable()){ toast('Open a timetable first (tab 7).'); return; }
  const mode=VIEW.mode, id=VIEW.id, sched=schedule(S.cfg).filter(x=>x.type==='period'); const name=mode==='class'?cls(id).name:mode==='room'?room(id).name:teacher(id).name;
  let out=`*${S.school||'School'} - ${name}*${S.term?' ('+S.term+')':''}\n`;
  S.cfg.days.forEach(d=>{ const lines=[]; sched.forEach(x=>{ if(mode==='class'&&x.period>levelPeriods(id)) return; const ci=cellInfo(mode,id,d+'_'+x.period); if(ci) lines.push(`${fmt(x.start)} ${ci.top}${ci.sub?' ('+ci.sub+')':''}`); }); if(lines.length) out+=`\n*${DAY_LABELS[d]}*\n`+lines.join('\n')+'\n'; });
  copyText(out);
}
function copyText(txt){ const done=()=>toast('Copied. Paste it into WhatsApp or SMS.'); if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done); }
function fallbackCopy(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy automatically.'); } ta.remove(); }

/* ---- teacher: unavailable periods ---- */
function openAvail(tid){
  const t=teacher(tid), cfg=S.cfg, slots=new Set(t.offSlots||[]);
  const rows=Array.from({length:cfg.periodsPerDay},(_,i)=>i+1).map(p=>`<tr><td><b>P${p}</b></td>${cfg.days.map(d=>{ const off=t.offDays.includes(d); return `<td style="text-align:center"><input type="checkbox" ${slots.has(d+'_'+p)||off?'checked':''} ${off?'disabled':''} onchange="toggleSlot('${tid}','${d}_${p}',this.checked)"></td>`; }).join('')}</tr>`).join('');
  $('modalBox').innerHTML=`<h2 style="margin:0 0 4px">${esc(t.name)}</h2><p class="h">Tick the periods this teacher is <b>not</b> available, for example a part-time teacher. A whole day off is set with the Days off boxes.</p>
    <div class="scroll"><table class="t"><thead><tr><th></th>${cfg.days.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="clearSlots('${tid}')">Clear all</button><span class="sp"></span><button class="btn pri" onclick="closeModal();render()">Done</button></div>`; $('modal').classList.add('on');
}
function toggleSlot(tid,key,on){ const t=teacher(tid), s=new Set(t.offSlots||[]); on?s.add(key):s.delete(key); t.offSlots=[...s]; save(); }
function clearSlots(tid){ teacher(tid).offSlots=[]; save(); openAvail(tid); }

/* ---- printouts: logo, term, head teacher, signature lines ---- */
function sheetHead(){ return `<div class="hd">${S.logo?`<img class="lg" src="${S.logo}" alt="">`:''}<div style="flex:1"><h2>${esc(S.school||'School')}</h2>${S.term?`<div class="tm2">${esc(S.term)}</div>`:''}</div><div class="pb"><span class="pm">${MARK_SVG}</span><span><b>EduSmart</b> Timetable</span></div></div><div class="flagbar" aria-hidden="true"><i></i><i></i><i></i></div>`; }
function sheetFoot(){ return `<div class="ft"><span>Prepared by</span><span>Head teacher: ${esc(S.head)}</span><span>Signature &amp; date</span></div><div class="bf">Prepared with EduSmart Timetable &middot; www.edusmartconsult.com</div>`; }
function printoutsCard(){ return `<div class="card"><h2>Printouts</h2><p class="h">Shown on every printed timetable, with signature lines at the bottom.</p>
  <div class="grid2"><div><label>Term / year</label><input value="${esc(S.term)}" placeholder="e.g. Term 2, 2026" onchange="S.term=this.value;save()"></div><div><label>Head teacher's name</label><input value="${esc(S.head)}" onchange="S.head=this.value;save()"></div></div>
  <div class="row" style="margin-top:12px">${S.logo?`<img src="${S.logo}" alt="logo" style="height:56px">`:''}<button class="btn sm" onclick="document.getElementById('logoIn').click()">${S.logo?'Change logo':'Add school logo'}</button>${S.logo?'<button class="btn sm bad" onclick="S.logo=\'\';save();render()">Remove logo</button>':''}<input id="logoIn" type="file" accept="image/*" style="display:none" onchange="loadLogo(this)"></div></div>`; }
function loadLogo(inp){ const f=inp.files[0]; inp.value=''; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const h=Math.min(160,img.height), w=Math.max(1,Math.round(img.width*h/img.height)), cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); S.logo=cv.toDataURL('image/png'); save(); render(); }; img.onerror=()=>toast('Could not read that image.'); img.src=r.result; };
  r.readAsDataURL(f); }

/* ---------- example school ---------- */
function loadExample(){
  if((S.teachers.length||Object.keys(S.timetable).length)&&!confirm('Replace your classes, teachers and lessons with the example school?')) return;
  S.classes=[]; S.plan={}; S.assign={}; S.doubles={}; S.timetable={}; S.prev=null; S.teachers=[]; REPORT=null;
  S.levels.forEach(l=>l.on=true);
  addMissingSubjects();
  const upperExtra={MSP1:['coremaths','physics','chemistry'],LANG:['english_major','kinya_major','french_major','basicmaths']};   /* illustrative only: REB does not list a pathway's subjects */
  LEVELS.forEach(l=>{ if(l.id==='upper') ['MSP1','LANG'].forEach(pw=>['S4','S5','S6'].forEach(g=>{ const id=addClassRaw(g+' '+PATHWAY_SHORT[pw],'upper',pw); upperExtra[pw].forEach(s=>{ if(S.subjects.some(x=>x.id===s)) S.plan[id][s]=REF.upper[s][0]; }); })); else l.grades.forEach(g=>addClassRaw(g,l.id,'')); });
  S.rooms=[]; S.roomPlan={}; S.subjectRooms={};
  const mkRoom=(name,kind,cap)=>{ const id=uid('r'); S.rooms.push({id,name,kind,cap:cap||1}); return id; };
  const physL=mkRoom('Physics Lab','Laboratory'),chemL=mkRoom('Chemistry Lab','Laboratory'),bioL=mkRoom('Biology Lab','Laboratory'),ict1=mkRoom('ICT Lab 1','ICT lab'),ict2=mkRoom('ICT Lab 2','ICT lab'),field=mkRoom('Playground','Playground / field',3); mkRoom('Library','Library');
  S.subjectRooms={physics:[physL],chemistry:[chemL],biology:[bioL],ict:[ict1,ict2],pes:[field]};
  const names=['Mukamana Alice','Habimana Jean','Uwase Grace','Niyonzima Eric','Ingabire Claire','Nsengimana Paul','Mutoni Diane','Kamanzi Sam','Bizimana Olivier','Uwimana Esther','Ndayisaba Joseph','Mukeshimana Rose','Hakizimana David','Umutoni Sandrine','Nkurunziza Patrick','Uwera Josiane','Ntakirutimana Eric','Mukandayisenga Marie','Habiyaremye Samuel','Iradukunda Chantal','Nshimiyimana Felix','Umuhoza Beatrice','Gasana Emmanuel','Mukamazimpaka Judith','Rukundo Alain','Uwamahoro Vestine','Twagirayezu Innocent','Nyirahabimana Jeanne','Bigirimana Theogene','Mugisha Kevin','Nyiraneza Odette','Karangwa Moses','Tuyisenge Aline','Ishimwe Peace','Munyaneza Aimable'];
  let n=0; const pool={};
  const teacherFor=(key,label)=>pool[key]||(pool[key]=(()=>{ const id=uid('t'); S.teachers.push({id,name:names[n%names.length]+' ('+label+')',offDays:[],offSlots:[],maxPerDay:0,pref:''}); n++; return id; })());
  const shared=['entrepreneurship','ict','pes','religion','gs','elective'];
  S.classes.forEach(c=>{ const plan=S.plan[c.id]; S.assign[c.id]={}; S.doubles[c.id]={};
    Object.keys(plan).forEach(sid=>{ let t;
      if(c.level==='pre') t=teacherFor('pre|'+c.id,c.name+' teacher');
      else if(c.level==='primary'||c.level==='plow') t=['french','arts','pes'].includes(sid)?teacherFor('prim|'+sid,subj(sid).short+', primary'):teacherFor('prim|'+c.id,c.name+' teacher');
      else if(shared.includes(sid)) t=teacherFor('sec|'+sid,subj(sid).short+', secondary');
      else t=teacherFor(c.level+'|'+sid,subj(sid).short+(c.level==='lower'?' S1-S3':' S4-S6'));
      if(c.level==='primary'||c.level==='plow'){ /* class teachers keep their own class, specialists are shared across both primary levels */ }
      S.assign[c.id][sid]=t;
      if(['pes','arts'].includes(sid)||((c.level==='lower'||c.level==='upper')&&['physics','chemistry','biology'].includes(sid))) S.doubles[c.id][sid]=true; }); });
  const fr=pool['prim|french']; if(fr){ const t=teacher(fr); t.offDays=['Fri']; t.offSlots=['Mon_1','Mon_2','Tue_1','Tue_2']; t.maxPerDay=6; t.pref='morning'; }
  save(); runGenerate(true); toast('Example school loaded: every level, with its teachers.');
}
function addMissingSubjects(){ SUBJECT_LIB.forEach(s=>{ if(!S.subjects.some(x=>x.id===s.id)) S.subjects.push(Object.assign({},s)); }); }

if(EMBED){ window.addEventListener('message',e=>{ const m=e.data; if(m&&m.type==='st-load'){ window.__SEED=m.data; S=load(); (m.staff||[]).forEach(s=>{ if(!S.teachers.some(x=>x.id===s.id)) S.teachers.push({id:s.id,name:s.name,offDays:[],offSlots:[],maxPerDay:0,pref:''}); }); if(!S.school&&m.school) S.school=m.school; prune(); render(); } }); parent.postMessage({type:'st-ready'},'*'); }
else { S=load(); prune(); render(); }
</script>
